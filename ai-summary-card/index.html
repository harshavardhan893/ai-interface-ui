<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Summary Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>AI Summary Card</h1>
        <p class="subtitle">View a quick AI-generated summary</p>

        <div class="summary-card">

            <div class="card-header">
                <h2>AI Summary</h2>
                <span class="status">Summary</span>
            </div>

            <div class="summary-content">
                <h3>Topic: Artificial Intelligence</h3>

                <p id="summaryText">
                    Artificial Intelligence is a technology that allows
                    computers to learn from information and perform tasks
                    that normally require human intelligence.
                </p>
            </div>

            <div class="card-footer">
                <span id="wordCount">Words: 24</span>
                <button onclick="expandSummary()">Read More</button>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
