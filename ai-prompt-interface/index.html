<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompt Interface</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>AI Prompt Interface</h1>
        <p class="subtitle">Enter a prompt and get an AI response</p>

        <div class="prompt-box">
            <textarea 
                id="promptInput"
                placeholder="Ask AI anything..."
            ></textarea>

            <button onclick="generateResponse()">
                Generate Response
            </button>
        </div>

        <div id="response" class="response-box">
            <h2>AI Response</h2>
            <p>Your response will appear here.</p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
